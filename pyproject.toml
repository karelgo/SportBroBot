[project]
name = "sportbrobot"
version = "0.1.0"
description = "SportBroBot — connect your Garmin, get an MCP server link, chat with your training data in any AI assistant."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "garminconnect>=0.3.2",
    "garth>=0.5",
    "mcp>=1.16",
    "cryptography>=43.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sportbrobot*"]

[tool.setuptools.package-data]
sportbrobot = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

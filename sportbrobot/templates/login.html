{% extends "base.html" %}

{% block title %}Log in — SportBroBot{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to reach your dashboard and MCP link.</p>
    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="stack">
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email" autofocus placeholder="you@example.com">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-alt">New here? <a href="/signup">Create an account</a></p>
  </div>
</section>
{% endblock %}
